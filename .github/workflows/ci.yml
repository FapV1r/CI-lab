name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type checking with mypy
        run: |
          mypy calculator.py --ignore-missing-imports

      - name: Linting with flake8
        run: |
          flake8 calculator.py test_calculator.py --max-line-length=120 --exclude=.venv

      - name: Run Unit Tests
        run: |
          pytest test_calculator.py -v --tb=short

      - name: Check coverage
        run: |
          pytest test_calculator.py --cov=calculator --cov-report=term-missing --cov-fail-under=90
